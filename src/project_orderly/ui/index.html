<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog Desk</title>
<style>
:root{color-scheme:dark;--bg:#18181B;--surface:#202024;--border:#33333A;--text:#F4F4F5;--muted:#A1A1AA;--accent:#60A5FA;--ok:#4ADE80;--warn:#FBBF24;--err:#F87171;--sel:#1E2A44;--hover:#2A2A30;--row:28px}
:root[data-theme=light]{color-scheme:light;--bg:#FAFAF9;--surface:#fff;--border:#E4E4E7;--text:#18181B;--muted:#71717A;--accent:#2563EB;--ok:#16A34A;--warn:#D97706;--err:#DC2626;--sel:#E8F0FE;--hover:#F4F4F5}
body.comfortable{--row:34px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:12px}
header{display:flex;gap:12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
header .grow{flex:1}
input,select,textarea,button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px 6px}
button{cursor:pointer}button:hover{background:var(--hover)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
main{display:grid;grid-template-columns:1fr 340px;min-height:0}
#tree{overflow:auto;position:relative;background:var(--surface);outline:none}
#spacer{position:relative}
.row{position:absolute;left:0;right:0;height:var(--row);display:flex;align-items:center;gap:8px;padding-right:12px;border-bottom:1px solid transparent;cursor:default;white-space:nowrap}
.row:hover{background:var(--hover)}.row.sel{background:var(--sel)}
.row.removed .title{text-decoration:line-through;color:var(--muted)}
.tw{width:16px;text-align:center;color:var(--muted);flex:none;cursor:pointer}
.dot{width:10px;height:10px;border-radius:2px;flex:none}
.id{color:var(--muted);width:120px;flex:none;overflow:hidden;text-overflow:ellipsis}
.title{flex:1;overflow:hidden;text-overflow:ellipsis}
.chip{padding:0 8px;border-radius:9px;font-size:11px;border:1px solid var(--border);flex:none}
.chip.InProgress{background:#2563EB22;border-color:#2563EB66}.chip.Resolved{background:#0D948822;border-color:#0D948866}
.chip.Completed{background:#16A34A22;border-color:#16A34A66}.chip.Removed{color:var(--muted)}
.num{width:60px;text-align:right;flex:none}.num.hint{color:var(--muted)}
.badge{width:16px;flex:none;text-align:center}.badge.E{color:var(--err)}.badge.W{color:var(--warn)}
aside{border-left:1px solid var(--border);padding:12px;overflow:auto;background:var(--bg)}
aside h2{font-size:15px;margin:0 0 8px}
aside label{display:block;color:var(--muted);font-size:11px;margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
aside input,aside select,aside textarea{width:100%}
aside textarea{min-height:100px;resize:vertical}
.issue{margin-top:8px;padding:4px 8px;border-left:3px solid var(--warn);background:var(--surface)}.issue.E{border-color:var(--err)}
footer{display:flex;gap:16px;padding:4px 12px;border-top:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px}
footer .grow{flex:1}.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.empty{color:var(--muted);padding:24px 0}
</style>
</head>
<body>
<header>
  <strong>Backlog Desk</strong>
  <input id="filter" placeholder="Filter title / id…  ( / )" style="width:260px">
  <button id="expandAll">Expand all</button> <button id="collapseAll">Collapse all</button>
  <label><input type="checkbox" id="showRemoved"> Show removed</label>
  <label><input type="checkbox" id="comfy"> Comfortable</label>
  <span class="grow"></span>
  <span id="dirty" class="muted"></span>
  <button id="theme" title="Toggle theme">☀</button>
  <button id="save">Save (Ctrl+S)</button>
</header>
<main>
  <div id="tree" tabindex="0"><div id="spacer"></div></div>
  <aside id="inspector"><div class="empty">Select an item.</div></aside>
</main>
<footer>
  <span id="validity"></span>
  <span id="count"></span>
  <span class="grow"></span>
  <span id="perf" class="mono"></span>
</footer>
<script>
"use strict";
const S = {items:new Map(), kids:new Map(), model:null, issues:[], issuesBy:new Map(), expanded:new Set(), rows:[], sel:null, filter:"", showRemoved:false};
const $ = id => document.getElementById(id);
const tree = $("tree"), spacer = $("spacer");
const rowH = () => parseInt(getComputedStyle(document.body).getPropertyValue("--row"));
const perf = {api:0, render:0};
const showPerf = () => $("perf").textContent = `api ${perf.api.toFixed(0)} ms · render ${perf.render.toFixed(1)} ms`;

async function api(name, ...args){
  const t = performance.now();
  const r = await window.pywebview.api[name](...args);
  perf.api = performance.now() - t; showPerf();
  return r;
}
const typeOf = it => S.model.types[it.type];
const cat = it => typeOf(it).states[it.state] || "Proposed";

function index(items){
  S.items = new Map(items.map(i => [i.id, i]));
  S.kids = new Map();
  for(const i of items){ const p = i.parent ?? null; if(!S.kids.has(p)) S.kids.set(p, []); S.kids.get(p).push(i.id); }
  for(const ids of S.kids.values()) ids.sort((a,b) => (S.items.get(a).rank||0) - (S.items.get(b).rank||0));
}
function setIssues(issues){
  S.issues = issues; S.issuesBy = new Map();
  for(const i of issues){ const cur = S.issuesBy.get(i.itemId); if(!cur || i.level==="E") S.issuesBy.set(i.itemId, i); }
  const e = issues.filter(i=>i.level==="E").length, w = issues.length - e;
  $("validity").innerHTML = e ? `<span class="err">⛔ ${e} error${e>1?"s":""} – not saved</span>` : `<span class="ok">✓ valid</span>` + (w?` · <span class="warn">${w} warning${w>1?"s":""}</span>`:"");
}

function buildRows(){
  const t = performance.now();
  const f = S.filter.toLowerCase(), rows = [];
  const matches = new Map(); // id -> subtree has a match
  const hit = it => !f || it.title.toLowerCase().includes(f) || it.id.toLowerCase().includes(f);
  const visit = (id) => {
    const it = S.items.get(id);
    if(!S.showRemoved && cat(it)==="Removed") return false;
    let any = hit(it);
    for(const c of S.kids.get(id)||[]) if(visit(c)) any = true;
    matches.set(id, any); return any;
  };
  for(const r of S.kids.get(null)||[]) visit(r);
  const walk = (id, depth) => {
    if(!matches.get(id)) return;
    rows.push({id, depth});
    if(S.expanded.has(id) || f) for(const c of S.kids.get(id)||[]) walk(c, depth+1);
  };
  for(const r of S.kids.get(null)||[]) walk(r, 0);
  S.rows = rows;
  $("count").textContent = `${rows.length} rows / ${S.items.size} items`;
  spacer.style.height = rows.length * rowH() + "px";
  perf.build = performance.now() - t;
}

function rowHTML(r, top){
  const it = S.items.get(r.id), ty = typeOf(it), c = cat(it), has = (S.kids.get(it.id)||[]).length;
  const roll = it.rollup, iss = S.issuesBy.get(it.id);
  const sp = roll ? `<span class="num hint" title="rollup: ${roll.estimatedCount} est, ${roll.unestimatedCount} unest, ${roll.notEstimableCount} n/e">Σ${roll.storyPoints}${roll.unestimatedCount?` +${roll.unestimatedCount}`:""}</span>`
                  : `<span class="num">${it.storyPoints ?? "–"}</span>`;
  return `<div class="row ${r.id===S.sel?"sel":""} ${c==="Removed"?"removed":""}" data-id="${esc(it.id)}" style="top:${top}px;padding-left:${8+r.depth*18}px">
    <span class="tw" data-tw="1">${has?(S.expanded.has(it.id)||S.filter?"▾":"▸"):""}</span>
    <span class="dot" style="background:${ty.color}" title="${ty.label}"></span>
    <span class="id mono">${esc(it.id)}</span>
    <span class="title">${esc(it.title)}</span>
    <span class="chip ${c}">${esc(it.state)}</span>
    <span class="num">${it.priority?"P"+it.priority:""}</span>${sp}
    <span class="badge ${iss?iss.level:""}" title="${iss?esc(iss.rule+": "+iss.message):""}">${iss?(iss.level==="E"?"⛔":"⚠"):""}</span></div>`;
}
const esc = s => String(s??"").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function paint(){
  const t = performance.now(), h = rowH();
  const first = Math.max(0, Math.floor(tree.scrollTop/h) - 5);
  const last = Math.min(S.rows.length, Math.ceil((tree.scrollTop + tree.clientHeight)/h) + 5);
  let html = "";
  for(let i=first;i<last;i++) html += rowHTML(S.rows[i], i*h);
  spacer.innerHTML = html;
  perf.render = performance.now() - t + (perf.build||0); showPerf();
}
const refresh = () => { buildRows(); paint(); };

function select(id, scroll=true){
  S.sel = id; renderInspector();
  if(scroll){
    const i = S.rows.findIndex(r => r.id===id), h = rowH();
    if(i>=0){ if(i*h < tree.scrollTop) tree.scrollTop = i*h; else if((i+1)*h > tree.scrollTop+tree.clientHeight) tree.scrollTop = (i+1)*h - tree.clientHeight; }
  }
  paint();
}

async function edit(id, field, value){
  const r = await api("update", id, field, value);
  for(const it of r.items) S.items.set(it.id, it);
  setIssues(r.issues); setDirty(r.dirty);
  refresh(); renderInspector(field);
}
function setDirty(d){ $("dirty").textContent = d ? "● unsaved" : "● saved"; $("dirty").className = d ? "warn" : "ok"; }

function renderInspector(keepFocus){
  const el = $("inspector"), it = S.items.get(S.sel);
  if(!it){ el.innerHTML = '<div class="empty">Select an item.</div>'; return; }
  const ty = typeOf(it), roll = it.rollup;
  const states = Object.keys(ty.states).map(s=>`<option ${s===it.state?"selected":""}>${esc(s)}</option>`).join("");
  const pr = [""," 1","2","3","4"].map(p=>`<option value="${p.trim()}" ${String(it.priority??"")===p.trim()?"selected":""}>${p.trim()?"P"+p.trim():"–"}</option>`).join("");
  const issues = S.issues.filter(i=>i.itemId===it.id).map(i=>`<div class="issue ${i.level}"><b>${i.rule}</b> ${esc(i.message)}</div>`).join("");
  el.innerHTML = `<h2><span class="dot" style="background:${ty.color};display:inline-block"></span> ${esc(ty.label)} <span class="mono" style="color:var(--muted)">${esc(it.id)}</span></h2>
    <label>Title</label><input id="f-title" value="${esc(it.title)}">
    <label>State</label><select id="f-state">${states}</select>
    <label>Priority${ty.priority==="required"?" *":""}</label><select id="f-priority">${pr}</select>
    ${ty.estimation==="forbidden" ? (roll?`<label>Effort (rollup)</label><div>Σ ${roll.storyPoints} (${roll.estimatedCount} est, ${roll.unestimatedCount} unest, ${roll.notEstimableCount} n/e)</div>`:"")
      : `<label>Story points${ty.estimation==="required"?" *":""}</label><input id="f-storyPoints" type="number" min="0" step="0.5" value="${it.storyPoints??""}">`}
    <label>Description</label><textarea id="f-description">${esc(it.description||"")}</textarea>
    ${issues}`;
  for(const f of ["title","state","priority","storyPoints","description"]){
    const n = $("f-"+f); if(!n) continue;
    n.addEventListener("change", () => edit(it.id, f, n.value));
  }
  if(keepFocus==="__none") return;
}

tree.addEventListener("scroll", paint);
window.addEventListener("resize", paint);
tree.addEventListener("click", e => {
  const row = e.target.closest(".row"); if(!row) return;
  const id = row.dataset.id;
  if(e.target.dataset.tw){ S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); refresh(); }
  select(id, false); tree.focus();
});
tree.addEventListener("keydown", e => {
  const i = S.rows.findIndex(r => r.id===S.sel), cur = S.rows[i];
  const go = n => { const r = S.rows[Math.max(0, Math.min(S.rows.length-1, n))]; if(r) select(r.id); e.preventDefault(); };
  if(e.key==="ArrowDown") go(i+1);
  else if(e.key==="ArrowUp") go(i-1);
  else if(e.key==="PageDown") go(i+Math.floor(tree.clientHeight/rowH()));
  else if(e.key==="PageUp") go(i-Math.floor(tree.clientHeight/rowH()));
  else if(e.key==="Home") go(0); else if(e.key==="End") go(S.rows.length-1);
  else if(cur && e.key==="ArrowRight"){ const has=(S.kids.get(cur.id)||[]).length; if(has && !S.expanded.has(cur.id)){S.expanded.add(cur.id);refresh();} else go(i+1); e.preventDefault(); }
  else if(cur && e.key==="ArrowLeft"){ if(S.expanded.has(cur.id)){S.expanded.delete(cur.id);refresh();} else { const p=S.items.get(cur.id).parent; if(p) select(p); } e.preventDefault(); }
  else if(e.key==="Enter"){ const t=$("f-title"); if(t){t.focus();t.select();} }
});
document.addEventListener("keydown", e => {
  if(e.key==="/" && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="TEXTAREA"){ e.preventDefault(); $("filter").focus(); }
  if(e.key==="Escape"){ document.activeElement.blur(); tree.focus(); }
  if((e.ctrlKey||e.metaKey) && e.key==="s"){ e.preventDefault(); save(); }
});
$("filter").addEventListener("input", e => { S.filter = e.target.value; refresh(); });
$("showRemoved").addEventListener("change", e => { S.showRemoved = e.target.checked; refresh(); });
$("comfy").addEventListener("change", e => { document.body.classList.toggle("comfortable", e.target.checked); refresh(); });
$("expandAll").addEventListener("click", () => { for(const [id,k] of S.kids) if(id && k.length) S.expanded.add(id); refresh(); });
$("collapseAll").addEventListener("click", () => { S.expanded.clear(); refresh(); });
$("save").addEventListener("click", save);
function setTheme(t){
  document.documentElement.dataset.theme = t; $("theme").textContent = t==="dark" ? "☀" : "☾";
  try{ localStorage.setItem("theme", t); }catch(e){}
}
$("theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme==="light" ? "dark" : "light"));
try{ setTheme(localStorage.getItem("theme")==="light" ? "light" : "dark"); }catch(e){ setTheme("dark"); }
async function save(){
  const r = await api("save");
  if(r.ok) setDirty(false); else alert(r.error);
}

window.addEventListener("pywebviewready", async () => {
  const snap = await api("snapshot");
  S.model = snap.model; index(snap.items); setIssues(snap.issues); setDirty(snap.dirty);
  for(const id of S.kids.get(null)||[]) S.expanded.add(id);
  if(S.items.size < 200) for(const id of S.items.keys()) S.expanded.add(id);
  refresh(); tree.focus();
  if(S.rows[0]) select(S.rows[0].id, false);
});
</script>
</body>
</html>
